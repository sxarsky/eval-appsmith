name: Skyramp Testbot

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.actor != 'skyramp-testbot[bot]' }}

jobs:
  testbot:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@skyramp-testbot') && github.event.comment.user.login != 'skyramp-testbot[bot]')
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: letsramp/testbot@b4f2eeaf2d16d9e0f390f28e9e8273799a7a4f80 # v0.11.7
        with:
          skyrampMcpVersion: "0.3.3"
          skyrampLicenseFile: ${{ secrets.SKYRAMP_LICENSE_FILE }}
          anthropicApiKey: ${{ secrets.SKYRAMP_TESTBOT_API_KEY }}
          githubAppId: ${{ secrets.SKYRAMP_TESTBOT_APP_ID }}
          githubAppPrivateKey: ${{ secrets.SKYRAMP_TESTBOT_APP_PRIVATE_KEY }}
          targetSetupCommand: >-
            docker compose -f $GITHUB_WORKSPACE/docker-compose.eval.yml -p appsmith-eval run --rm appsmith-builder && docker compose -f $GITHUB_WORKSPACE/docker-compose.eval.yml -p appsmith-eval run --rm appsmith-frontend-builder && docker compose -f $GITHUB_WORKSPACE/docker-compose.eval.yml -p appsmith-eval up -d --wait --wait-timeout 900
          targetTeardownCommand: 'docker compose -f $GITHUB_WORKSPACE/docker-compose.eval.yml -p appsmith-eval down -v'
          authTokenCommand: 'bash $GITHUB_WORKSPACE/get-auth-token.sh'
          uiCredentials: 'eval@skyramp.dev:EvalPass123!'
